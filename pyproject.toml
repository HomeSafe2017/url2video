[project]
name = "url2video"
version = "0.2.0"
description = "抖音无水印视频下载器 — Download Douyin videos without watermark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "杨佳宁", email = "3120730898@qq.com" },
]
keywords = ["douyin", "tiktok", "video-downloader", "playwright", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "playwright>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/HomeSafe2017/url2video"
Repository = "https://github.com/HomeSafe2017/url2video.git"
Issues = "https://github.com/HomeSafe2017/url2video/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["url2video*"]
